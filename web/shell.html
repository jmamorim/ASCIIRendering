<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII renderer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
  canvas { display: block; outline: none; }
  #status {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #aaa; font: 15px/1.4 system-ui, sans-serif; text-align: center; padding: 16px;
  }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
<div id="status">Loading…</div>
<script>
  var statusEl = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    onRuntimeInitialized: function () { statusEl.remove(); },
    onAbort: function () {
      statusEl.textContent = 'The ASCII renderer could not start. It needs a browser with WebAssembly and WebGL.';
    },
  };
</script>
{{{ SCRIPT }}}
</body>
</html>
